name: Source and CPU regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: environments/requirements-cpu.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r environments/requirements-cpu.txt
          python -m pip install --no-deps -e .
      - name: Check public source and documentation
        run: python scripts/check_submission.py
      - name: Run hardware-free regressions
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '2'
          HF_HUB_OFFLINE: '1'
          PYTHONPATH: ./src:.
        run: python -m pytest -q experiments/b601/tests experiments/libero/visual_ttt
