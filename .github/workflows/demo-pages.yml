name: Publish demo videos

on:
  push:
    branches: [main]
    paths:
      - demo-site/**
      - assets/demos/**
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Package the video gallery
        run: |
          mkdir -p build/demo-site/assets/demos
          cp demo-site/index.html build/demo-site/index.html
          cp assets/demos/*.mp4 assets/demos/*.jpg assets/demos/manifest.json build/demo-site/assets/demos/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/demo-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
